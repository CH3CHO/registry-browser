name: Release

# 推送形如 v1.2.3 的 tag 时构建各平台产物并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一个 tag 不并发跑两轮发布任务
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            asset: registry-browser-windows-amd64.exe
            binary: bin/registry-browser.exe
          - os: macos-15
            goarch: arm64
            asset: registry-browser-darwin-arm64
            binary: bin/registry-browser
          - os: macos-15-intel
            goarch: amd64
            asset: registry-browser-darwin-amd64
            binary: bin/registry-browser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # macOS 的 BSD sed 要求 -i 必须带后缀，-i.bak 在 GNU/BSD 上都可用
          sed -i.bak "s/^  version: .*/  version: \"${VERSION}\"/" build/config.yml
          rm -f build/config.yml.bak
          wails3 task common:update:build-assets

      - name: Build
        shell: bash
        run: wails3 build

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 同一个 tag 可能对应多个 release（GitHub 允许同名草稿并存），
          # 所以按 id 精确定位：优先已发布的那个，其次任意一个。
          # 这里不能用 gh release view —— release job 没有 checkout 仓库，
          # gh 无法从 git 远端推断仓库名，必须显式给 --repo。
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --jq "map(select(.tag_name == \"${TAG}\")) as \$rs | ((\$rs | map(select(.draft == false)) | first) // (\$rs | first) // {}) | .id // empty")

          if [ -z "${RELEASE_ID}" ]; then
            echo "::notice::release ${TAG} 不存在，创建新的"
            gh release create "${TAG}" artifacts/* \
              --title "${TAG}" \
              --generate-notes \
              --repo "${REPO}"
            exit 0
          fi

          echo "::notice::release ${TAG} 已存在 (id=${RELEASE_ID})，改为补传产物"

          if [ "$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .draft)" = "true" ]; then
            echo "::notice::该 release 还是草稿，先发布出去"
            gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -f draft=false > /dev/null
          fi

          # 按 release id 上传，避免同名 release 造成歧义；
          # 同名资产先删后传，让重复触发保持幂等。
          for file in artifacts/*; do
            name=$(basename "${file}")

            for asset_id in $(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${name}\") | .id"); do
              echo "::notice::删除同名旧资产 ${name} (id=${asset_id})"
              gh api -X DELETE "repos/${REPO}/releases/assets/${asset_id}" > /dev/null
            done

            echo "::notice::上传 ${name}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              --data-binary "@${file}" > /dev/null
          done
